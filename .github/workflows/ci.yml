name: CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint

  test:
    name: Test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo test

  test-cv:
    name: Test (CV Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (high + critical)
        run: pnpm audit --audit-level=high || true
      - name: Check for known vulnerable patterns
        run: |
          echo "Checking for eval() usage in source..."
          ! grep -rn 'eval(' apps/ packages/ --include='*.ts' --include='*.tsx' || echo "Warning: eval() found"
          echo "Checking for innerHTML assignment..."
          ! grep -rn 'innerHTML' apps/ packages/ --include='*.ts' --include='*.tsx' || echo "Warning: innerHTML found"
          echo "Static checks complete"

  evidence-bundle-check:
    name: Evidence Bundle Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify docs exist
        run: |
          test -f docs/planning-v2/README.md
          echo "Evidence bundle docs present"

  test-integration:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: physiolens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/physiolens_test
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/physiolens_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Push Drizzle schema
        working-directory: apps/api
        run: npx drizzle-kit push
      - name: Run integration tests
        working-directory: apps/api
        run: pnpm test:integration

  docker-build:
    name: Docker Build & Boot Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t physiolens-api -f apps/api/Dockerfile .
      - name: Build Web image
        run: docker build -t physiolens-web -f apps/web/Dockerfile .
      - name: Verify API boots without optional keys
        run: |
          docker run --rm -d --name api-check \
            -e JWT_SECRET=ci-test-secret \
            -e NODE_ENV=development \
            physiolens-api
          sleep 5
          docker exec api-check node -e "require('http').get('http://localhost:4000/api/health',(r)=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>{console.log(d);process.exit(r.statusCode===200?0:1)})})"
          docker stop api-check
      - name: Verify Web boots
        run: |
          docker run --rm -d --name web-check physiolens-web
          sleep 5
          docker exec web-check node -e "require('http').get('http://localhost:3000/',(r)=>{process.exit(r.statusCode===200?0:1)})"
          docker stop web-check
